include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/linux-qt6.yml
      - /gitlab-templates/linux-qt6-next.yml
      - /gitlab-templates/linux-qt6-static.yml
      - /gitlab-templates/freebsd-qt6.yml
      - /gitlab-templates/alpine-qt6.yml

# CI only, not for upstream: build against our stack (.stack-ci/), not only KDE's packages.
stack_publish:
  extends:
  - .ci_linux_base
  - .suse_tumbleweed_qt6stable
  stage: build
  when: manual
  script:
  - python3 -u .stack-ci/stack-ci prepare --use all --mode build --ci-utilities ci-utilities
  - python3 -u .stack-ci/stack-ci publish
